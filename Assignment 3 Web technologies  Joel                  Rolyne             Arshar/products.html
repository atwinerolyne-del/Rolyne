<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GOODTIMES SUPERMARKET | Products</title>

    <link rel="stylesheet" href="style.css">
</head>
<style>
    body{
        background-color: #f77cf7;
    }
    .jjj{
        background-color: #fdb32a;
    }
    }
</style>

<body>
    <div class="jjj">

    <!-- NAVBAR -->
    <header class="navbar">

        <div class="logo">
            GOODTIMES SUPERMARKET
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html" class="active">Products</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact</a>

            <button>
  <img src="cart.jpg" alt="Cart" width="30">
  Cart
</button>

        </nav>

    </header>


    <!-- PRODUCTS -->

    <main class="products-page">

        <section class="products-intro">

            <h1>Our Products</h1>

            <p>
                Fresh and quality products at affordable prices.
            </p>

        </section>


        <!-- SEARCH AND FILTER -->

        <section class="products-controls">

            <input
                type="text"
                id="search"
                placeholder="Search products..."
            >

            <select id="category">

                <option value="all">All Categories</option>
                <option value="Fruits">Fruits <img src="fruits.jpg" alt="Fresh fruits"></option>
                <option value="Vegetables">Vegetables</option>
                <option value="Drinks">Drinks</option>
                <option value="Food">Food</option>
                <option value="Home use">Home use</option>

            </select>

        </section>


        <div class="products-heading">

            <h2>Fresh Products</h2>

        <img src="fruits.jpg" alt="Fresh fruits" width="100" height="100">
        <img src="dairy.jpg" alt="Drinks" width="100" height="100">
        <img src="house.jpg" alt="household" width="100" height="100">
        <img src="vegi.jpg" alt="Vegetables" width="100" height="100">
        <img src="Bread.png" alt="Bread" width="100" height="100">


        </section>

        

    </main>


    <!-- FOOTER -->

    <footer>

        <p>© 2026 GoodTimes supermarket. All rights reserved.</p>

    </footer>


    <script src="products.js"></script>
    </div>

</body>

</html>
